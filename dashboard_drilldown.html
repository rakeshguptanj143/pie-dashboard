<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily P&L Dashboard - Interactive</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1f77b4;
            --secondary: #ff7f0e;
            --success: #2ca02c;
            --danger: #d62728;
            --neutral: #7f7f7f;
            --bg-light: #f8f9fa;
            --bg-dark: #2b2b2b;
            --text-dark: #1a1a1a;
            --text-light: #e0e0e0;
            --border: #e0e0e0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #6ba3d9;
                --secondary: #ffb366;
                --success: #5dd95d;
                --danger: #ff6b6b;
                --neutral: #aaa;
                --bg-light: #1a1a1a;
                --text-dark: #e0e0e0;
                --border: #333;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 0.95em;
            color: var(--text-dark);
            opacity: 0.8;
        }

        .mtd-banner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(31, 119, 180, 0.08), rgba(255, 127, 14, 0.08));
            border-radius: 12px;
            border: 2px solid var(--border);
        }

        .mtd-card {
            text-align: center;
            padding: 15px;
        }

        .mtd-label {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .mtd-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            .summary-card {
                background: #2b2b2b;
            }
        }

        .summary-card .label {
            font-size: 0.8em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .summary-card .value {
            font-size: 1.4em;
            font-weight: bold;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .day-box {
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .day-box:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            border-color: var(--primary);
        }

        @media (prefers-color-scheme: dark) {
            .day-box {
                background: #2b2b2b;
            }
            .day-box:hover {
                box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            }
        }

        .day-date {
            font-size: 0.85em;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .entity-pnl {
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .entity-label {
            font-size: 0.7em;
            opacity: 0.7;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .entity-value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .pie-gain {
            background: rgba(44, 160, 44, 0.15);
            color: var(--success);
            border: 1px solid rgba(44, 160, 44, 0.3);
        }

        .pie-loss {
            background: rgba(214, 39, 40, 0.15);
            color: var(--danger);
            border: 1px solid rgba(214, 39, 40, 0.3);
        }

        .pinkcity-gain {
            background: rgba(44, 160, 44, 0.15);
            color: var(--success);
            border: 1px solid rgba(44, 160, 44, 0.3);
        }

        .pinkcity-loss {
            background: rgba(214, 39, 40, 0.15);
            color: var(--danger);
            border: 1px solid rgba(214, 39, 40, 0.3);
        }

        /* DRILL-DOWN MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: var(--bg-light);
            margin: auto;
            padding: 0;
            border-radius: 12px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 25px;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.8em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 25px;
        }

        .drill-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .drill-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        @media (prefers-color-scheme: dark) {
            .drill-section {
                background: #2b2b2b;
            }
        }

        .drill-section h3 {
            margin-bottom: 15px;
            font-size: 1.1em;
            opacity: 0.8;
        }

        #componentChart {
            max-height: 300px;
        }

        .trade-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .trade-table th {
            background: var(--primary);
            color: white;
            padding: 10px;
            text-align: left;
            font-weight: 600;
        }

        .trade-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .trade-table tr:hover {
            background: rgba(31, 119, 180, 0.05);
        }

        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            opacity: 0.7;
            font-size: 0.9em;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .summary-section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .drill-grid {
                grid-template-columns: 1fr;
            }
            .mtd-banner {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Daily P&L Dashboard</h1>
            <p class="subtitle">Click any day to see detailed breakdown</p>
        </div>

        <div class="status" id="status">Loading data...</div>

        <!-- MONTH-TO-DATE TOTALS -->
        <div class="mtd-banner" id="mtdBanner">
            <div style="text-align: center; padding: 20px;">Loading MTD data...</div>
        </div>

        <div class="summary-section-title">31-Day Rolling Summary</div>
        <div class="summary-bar" id="summaryBar"></div>

        <div class="summary-section-title">Daily Breakdown (Click to Drill Down)</div>
        <div class="days-grid" id="daysGrid">
            <div style="text-align: center; padding: 20px;">Generating daily boxes...</div>
        </div>

        <div class="footer">
            Last Updated: <span id="lastUpdated">—</span>
        </div>
    </div>

    <!-- DRILL-DOWN MODAL -->
    <div id="drillDownModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="close-btn" onclick="closeDrillDown()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="drill-grid">
                    <div class="drill-section">
                        <h3>Component Breakdown</h3>
                        <canvas id="componentChart"></canvas>
                    </div>
                    <div class="drill-section">
                        <h3>Daily Summary</h3>
                        <div id="drillSummary"></div>
                    </div>
                </div>
                <div class="drill-section">
                    <h3>Closed Positions</h3>
                    <table class="trade-table" id="tradesTable">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Details</th>
                                <th>P&L</th>
                            </tr>
                        </thead>
                        <tbody id="tradesBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalData = null;
        let currentChart = null;

        window.addEventListener('load', () => {
            loadDataAuto();
        });

        async function loadDataAuto() {
            try {
                const response = await fetch('dashboard_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                globalData = await response.json();
                document.getElementById('status').textContent = 'Data loaded successfully';
                renderDashboard();
            } catch (err) {
                document.getElementById('status').textContent = `Error: ${err.message}`;
                console.error('Error:', err);
            }
        }

        function formatCurrency(val) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(val);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                weekday: 'short'
            });
        }

        function formatFullDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function isWeekend(dateStr) {
            const d = new Date(dateStr);
            const day = d.getDay();
            return day === 0 || day === 6;
        }

        function getLast31Days(records) {
            if (records.length <= 31) return records;
            return records.slice(-31);
        }

        function getCurrentMonth(records) {
            if (!records || records.length === 0) return [];
            const lastRecord = records[records.length - 1];
            const lastDate = new Date(lastRecord.date);
            const dataMonth = lastDate.getMonth();
            const dataYear = lastDate.getFullYear();

            return records.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === dataMonth && recordDate.getFullYear() === dataYear;
            });
        }

        function renderDashboard() {
            if (!globalData || globalData.records.length === 0) {
                document.getElementById('status').textContent = 'No data available';
                return;
            }

            const monthRecords = getCurrentMonth(globalData.records);
            const last31Records = getLast31Days(globalData.records);

            if (globalData.last_updated) {
                document.getElementById('lastUpdated').textContent = new Date(globalData.last_updated).toLocaleString();
            }

            renderMTDBanner(monthRecords);
            renderSummaryBar(last31Records);
            renderDayBoxes(last31Records);

            document.getElementById('status').textContent = `Showing last ${last31Records.length} trading days (${monthRecords.length} in current month)`;
        }

        function renderMTDBanner(records) {
            const entityAMtd = records.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBMtd = records.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);

            const currentDate = new Date();
            const monthName = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const mtdHtml = `
                <div class="mtd-card">
                    <div class="mtd-label">Entity A</div>
                    <div class="mtd-value" style="color: ${entityAMtd >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityAMtd)}
                    </div>
                    <div class="mtd-period">Month-to-Date (${monthName})</div>
                </div>
                <div class="mtd-card">
                    <div class="mtd-label">Entity B</div>
                    <div class="mtd-value" style="color: ${entityBMtd >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityBMtd)}
                    </div>
                    <div class="mtd-period">Month-to-Date (${monthName})</div>
                </div>
            `;
            document.getElementById('mtdBanner').innerHTML = mtdHtml;
        }

        function renderSummaryBar(records) {
            const entityATotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBTotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);
            const combinedPnl = entityATotalPnl + entityBTotalPnl;

            const summaryHtml = `
                <div class="summary-card">
                    <div class="label">Entity A 31-Day</div>
                    <div class="value" style="color: ${entityATotalPnl >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityATotalPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Entity B 31-Day</div>
                    <div class="value" style="color: ${entityBTotalPnl >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityBTotalPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Combined 31-Day</div>
                    <div class="value" style="color: ${combinedPnl >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(combinedPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Trading Days</div>
                    <div class="value">${records.length}</div>
                </div>
            `;
            document.getElementById('summaryBar').innerHTML = summaryHtml;
        }

        function renderDayBoxes(records) {
            const daysHtml = records.map(record => {
                const date = record.date;
                const entityAPnl = record['pnl_Entity_A'] || 0;
                const entityBPnl = record['pnl_Entity_B'] || 0;
                const isWeekendDay = isWeekend(date);

                return `
                    <div class="day-box ${isWeekendDay ? 'weekend' : ''}" onclick="openDrillDown('${date}')">
                        <div class="day-date">${formatDate(date)}</div>
                        <div class="day-content">
                            <div class="entity-pnl ${entityAPnl >= 0 ? 'pie-gain' : 'pie-loss'}">
                                <div class="entity-label">Entity A</div>
                                <div class="entity-value">${formatCurrency(entityAPnl)}</div>
                            </div>
                            <div class="entity-pnl ${entityBPnl >= 0 ? 'pinkcity-gain' : 'pinkcity-loss'}">
                                <div class="entity-label">Entity B</div>
                                <div class="entity-value">${formatCurrency(entityBPnl)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('daysGrid').innerHTML = daysHtml;
        }

        function openDrillDown(date) {
            const record = globalData.records.find(r => r.date === date);
            if (!record) return;

            document.getElementById('modalTitle').textContent = `${formatFullDate(date)} - Detailed Breakdown`;

            renderDrillDownContent(record);
            document.getElementById('drillDownModal').style.display = 'block';
        }

        function closeDrillDown() {
            document.getElementById('drillDownModal').style.display = 'none';
            if (currentChart) {
                currentChart.destroy();
                currentChart = null;
            }
        }

        function renderDrillDownContent(record) {
            const eaComm = record.commission_and_fees_Entity_A || 0;
            const eaGP = record.gross_profit_or_loss_Entity_A || 0;
            const eaOpt = record.option_premium_Entity_A || 0;
            const eaPnl = record.pnl_Entity_A || 0;

            const ebComm = record.commission_and_fees_Entity_B || 0;
            const ebGP = record.gross_profit_or_loss_Entity_B || 0;
            const ebOpt = record.option_premium_Entity_B || 0;
            const ebPnl = record.pnl_Entity_B || 0;

            const summaryHtml = `
                <div style="margin-bottom: 20px;">
                    <div style="font-weight: 600; margin-bottom: 10px; font-size: 1.1em;">Entity A</div>
                    <table style="width: 100%; font-size: 0.9em; line-height: 1.8;">
                        <tr><td>Commission & Fees:</td><td style="text-align: right;">${formatCurrency(eaComm)}</td></tr>
                        <tr><td>Gross P/L:</td><td style="text-align: right;">${formatCurrency(eaGP)}</td></tr>
                        <tr><td>Option Premium:</td><td style="text-align: right;">${formatCurrency(eaOpt)}</td></tr>
                        <tr style="border-top: 2px solid var(--border); font-weight: 600;"><td>Daily P/L:</td><td style="text-align: right; color: ${eaPnl >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatCurrency(eaPnl)}</td></tr>
                    </table>
                </div>
                <div>
                    <div style="font-weight: 600; margin-bottom: 10px; font-size: 1.1em;">Entity B</div>
                    <table style="width: 100%; font-size: 0.9em; line-height: 1.8;">
                        <tr><td>Commission & Fees:</td><td style="text-align: right;">${formatCurrency(ebComm)}</td></tr>
                        <tr><td>Gross P/L:</td><td style="text-align: right;">${formatCurrency(ebGP)}</td></tr>
                        <tr><td>Option Premium:</td><td style="text-align: right;">${formatCurrency(ebOpt)}</td></tr>
                        <tr style="border-top: 2px solid var(--border); font-weight: 600;"><td>Daily P/L:</td><td style="text-align: right; color: ${ebPnl >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatCurrency(ebPnl)}</td></tr>
                    </table>
                </div>
            `;
            document.getElementById('drillSummary').innerHTML = summaryHtml;

            // Render component breakdown chart for Entity A
            renderComponentChart(eaComm, eaGP, eaOpt);

            // Render trades table
            renderTradesTable(record);
        }

        function renderComponentChart(comm, gp, opt) {
            const ctx = document.getElementById('componentChart').getContext('2d');

            if (currentChart) {
                currentChart.destroy();
            }

            const data = [
                Math.abs(comm),
                Math.abs(gp),
                Math.abs(opt)
            ];

            const colors = [
                comm < 0 ? '#d62728' : '#2ca02c',
                gp < 0 ? '#d62728' : '#2ca02c',
                opt < 0 ? '#d62728' : '#2ca02c'
            ];

            currentChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [
                        `Commission\n${formatCurrency(comm)}`,
                        `Gross P/L\n${formatCurrency(gp)}`,
                        `Options\n${formatCurrency(opt)}`
                    ],
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-light'),
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function renderTradesTable(record) {
            const tbody = document.getElementById('tradesBody');
            tbody.innerHTML = '';

            const trades = record.trades || [];
            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; opacity: 0.6;">No trade data available</td></tr>';
                return;
            }

            trades.forEach(trade => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${trade.symbol || 'N/A'}</strong></td>
                    <td>${trade.details || 'Details'}</td>
                    <td style="text-align: right; color: ${trade.pnl >= 0 ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">
                        ${formatCurrency(trade.pnl || 0)}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('drillDownModal');
            if (event.target == modal) {
                closeDrillDown();
            }
        }
    </script>
</body>
</html>
