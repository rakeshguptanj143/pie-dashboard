<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Daily P&L Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.2;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            padding: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 1px;
        }

        .header .subtitle {
            font-size: 9px;
            color: var(--text-secondary);
        }

        .status {
            font-size: 9px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        /* KPI GRID */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .kpi-card {
            padding: 6px;
            border-radius: 3px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .kpi-label {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1;
        }

        .kpi-value {
            font-size: 12px;
            font-weight: 600;
            line-height: 1;
            word-break: break-word;
        }

        .kpi-value.profit {
            color: var(--success);
        }

        .kpi-value.loss {
            color: var(--danger);
        }

        .kpi-period {
            font-size: 7px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* SUMMARY SECTION */
        .summary-section-title {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            margin-top: 4px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .summary-card {
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 4px;
            text-align: center;
            background: var(--bg-secondary);
        }

        .summary-card .label {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            color: var(--text-secondary);
            margin-bottom: 2px;
            font-weight: 500;
            line-height: 1;
        }

        .summary-card .value {
            font-size: 11px;
            font-weight: 600;
            line-height: 1;
            word-break: break-word;
        }

        /* DAILY BREAKDOWN GRID */
        .days-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 2px;
            flex: 1;
        }

        /* Custom scrollbar */
        .days-grid::-webkit-scrollbar {
            width: 4px;
        }

        .days-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .days-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .day-box {
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 6px;
            transition: all 0.2s ease;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-height: 0;
        }

        .day-box:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .day-date {
            font-size: 10px;
            font-weight: 600;
            color: #000000;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .day-content {
            display: flex;
            flex-direction: row;
            gap: 4px;
            align-items: center;
            justify-content: space-between;
        }

        .entity-section {
            display: flex;
            flex-direction: column;
            padding: 0;
            line-height: 1;
            flex: 1;
            text-align: center;
        }

        .entity-label {
            font-size: 7px;
            color: #666666;
            font-weight: 500;
            margin-bottom: 1px;
            text-transform: uppercase;
        }

        .entity-value {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: -0.1px;
            margin: 0;
            padding: 0;
            line-height: 1;
            word-break: break-word;
        }

        .entity-value.profit {
            color: var(--success);
        }

        .entity-value.loss {
            color: var(--danger);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding-top: 3px;
            border-top: 1px solid var(--border-color);
            font-size: 8px;
            color: var(--text-secondary);
            flex-shrink: 0;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: var(--text-secondary);
            font-size: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 1400px) {
            .days-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 1200px) {
            .days-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }

            .summary-bar {
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }
        }

        @media (max-width: 992px) {
            .container {
                padding: 6px;
            }

            .days-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
            }

            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
                margin-bottom: 4px;
            }

            .summary-bar {
                grid-template-columns: repeat(2, 1fr);
                gap: 3px;
                margin-bottom: 4px;
            }

            .day-box {
                padding: 5px;
                gap: 2px;
            }

            .day-date {
                font-size: 9px;
            }

            .entity-value {
                font-size: 10px;
            }

            .header h1 {
                font-size: 13px;
            }

            .header .subtitle {
                font-size: 8px;
            }

            .header {
                margin-bottom: 4px;
                padding-bottom: 2px;
            }

            .status {
                font-size: 8px;
                margin-bottom: 2px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 5px;
            }

            .header h1 {
                font-size: 12px;
                margin-bottom: 0px;
            }

            .header .subtitle {
                font-size: 7px;
            }

            .header {
                margin-bottom: 3px;
                padding-bottom: 2px;
            }

            .status {
                font-size: 7px;
                margin-bottom: 2px;
            }

            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 3px;
                margin-bottom: 3px;
            }

            .kpi-card {
                padding: 5px;
                gap: 1px;
            }

            .kpi-label {
                font-size: 6px;
            }

            .kpi-value {
                font-size: 11px;
            }

            .summary-section-title {
                font-size: 6px;
                margin-bottom: 2px;
                margin-top: 3px;
            }

            .summary-bar {
                grid-template-columns: repeat(2, 1fr);
                gap: 3px;
                margin-bottom: 3px;
            }

            .summary-card {
                padding: 3px;
            }

            .summary-card .label {
                font-size: 6px;
                margin-bottom: 1px;
            }

            .summary-card .value {
                font-size: 10px;
            }

            .days-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 3px;
                margin-bottom: 2px;
            }

            .day-box {
                padding: 4px;
                gap: 2px;
            }

            .day-date {
                font-size: 8px;
            }

            .entity-label {
                font-size: 6px;
                margin-bottom: 0px;
            }

            .entity-value {
                font-size: 9px;
            }

            .footer {
                font-size: 7px;
                padding-top: 2px;
                margin-top: 2px;
            }
        }

        @media screen and (max-width: 480px) {
            .container {
                padding: 6px;
                overflow-y: auto;
                overflow-x: hidden;
            }

            html, body {
                overflow: auto;
            }

            .header h1 {
                font-size: 16px;
                margin-bottom: 2px;
            }

            .header .subtitle {
                font-size: 11px;
            }

            .header {
                margin-bottom: 8px;
                padding-bottom: 6px;
            }

            .status {
                font-size: 10px;
                margin-bottom: 6px;
            }

            .kpi-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px;
                margin-bottom: 8px;
            }

            .kpi-card {
                padding: 8px;
                gap: 3px;
            }

            .kpi-label {
                font-size: 10px;
            }

            .kpi-value {
                font-size: 16px;
            }

            .kpi-period {
                font-size: 9px;
            }

            .summary-section-title {
                font-size: 10px;
                margin-bottom: 6px;
                margin-top: 8px;
            }

            .summary-bar {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 6px;
                margin-bottom: 8px;
            }

            .summary-card {
                padding: 8px;
            }

            .summary-card .label {
                font-size: 10px;
                margin-bottom: 4px;
            }

            .summary-card .value {
                font-size: 16px;
            }

            .days-section {
                overflow: visible !important;
            }

            .days-grid {
                grid-template-columns: repeat(3, 1fr) !important;
                gap: 6px !important;
                margin-bottom: 8px;
                overflow-y: auto !important;
                overflow-x: hidden !important;
                max-height: 400px;
            }

            .day-box {
                padding: 5px;
                gap: 2px;
            }

            .day-date {
                font-size: 11px;
            }

            .day-content {
                gap: 3px;
            }

            .entity-label {
                font-size: 8px;
                margin-bottom: 1px;
            }

            .entity-value {
                font-size: 12px;
            }

            .footer {
                font-size: 10px;
                padding-top: 8px;
                margin-top: 8px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 3px;
            }

            .header h1 {
                font-size: 10px;
            }

            .kpi-value {
                font-size: 9px;
            }

            .summary-card .value {
                font-size: 8px;
            }

            .entity-value {
                font-size: 7px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>P&L Dashboard</h1>
            <p class="subtitle">Portfolio Performance</p>
        </div>

        <div class="status" id="status">Loading...</div>

        <!-- KPI GRID -->
        <div class="kpi-grid" id="kpiGrid">
            <div class="loading">Loading...</div>
        </div>

        <!-- SUMMARY METRICS -->
        <div class="summary-section-title">31-Day Summary</div>
        <div class="summary-bar" id="summaryBar"></div>

        <!-- DAILY BREAKDOWN -->
        <div class="summary-section-title">Daily P&L</div>
        <div class="days-section">
            <div class="days-grid" id="daysGrid">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <div class="footer">
            Updated: <span id="lastUpdated">—</span>
        </div>
    </div>

    <script>
        let globalData = null;

        window.addEventListener('load', () => {
            loadDataAuto();
        });

        async function loadDataAuto() {
            try {
                const response = await fetch('dashboard_data.json');
                if (!response.ok) throw new Error(`Error: ${response.status}`);
                globalData = await response.json();
                document.getElementById('status').textContent = 'Data loaded';
                renderDashboard();
            } catch (err) {
                document.getElementById('status').textContent = `Error: ${err.message}`;
            }
        }

        function formatCurrency(val) {
            const sign = val < 0 ? '-$' : '$';
            const absVal = Math.abs(val);
            const formatted = new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
                useGrouping: false
            }).format(absVal);
            return sign + formatted;
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function getCurrentMonth(records) {
            if (!records || records.length === 0) return [];
            const lastRecord = records[records.length - 1];
            const lastDate = new Date(lastRecord.date);
            const dataMonth = lastDate.getMonth();
            const dataYear = lastDate.getFullYear();
            return records.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === dataMonth && recordDate.getFullYear() === dataYear;
            });
        }

        function getPriorMonth(records) {
            if (!records || records.length === 0) return [];
            const lastRecord = records[records.length - 1];
            const lastDate = new Date(lastRecord.date);

            let priorMonth = lastDate.getMonth() - 1;
            let priorYear = lastDate.getFullYear();
            if (priorMonth < 0) {
                priorMonth = 11;
                priorYear--;
            }

            return records.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === priorMonth && recordDate.getFullYear() === priorYear;
            });
        }

        function getMonthlyRolling(records) {
            // Rolling 24-day window: as current month grows, previous month rolls off
            if (records.length <= 24) return records;
            return records.slice(-24);
        }

        function renderDashboard() {
            if (!globalData || globalData.records.length === 0) {
                document.getElementById('status').textContent = 'No data';
                return;
            }

            const rollingRecords = getMonthlyRolling(globalData.records);

            if (globalData.last_updated) {
                document.getElementById('lastUpdated').textContent = new Date(globalData.last_updated).toLocaleString();
            }

            renderKPIGrid(rollingRecords);
            renderSummaryBar(rollingRecords);
            renderDayBoxes(rollingRecords);

            document.getElementById('status').textContent = `${rollingRecords.length} days (monthly rolling)`;
        }

        function renderKPIGrid(rollingRecords) {
            // Separate current month and prior month within the rolling data
            const lastRecord = rollingRecords[rollingRecords.length - 1];
            const currentMonth = new Date(lastRecord.date).getMonth();
            const currentYear = new Date(lastRecord.date).getFullYear();

            let priorMonth = currentMonth - 1;
            let priorYear = currentYear;
            if (priorMonth < 0) {
                priorMonth = 11;
                priorYear--;
            }

            const monthRecords = rollingRecords.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === currentMonth && recordDate.getFullYear() === currentYear;
            });

            const priorMonthRecords = rollingRecords.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === priorMonth && recordDate.getFullYear() === priorYear;
            });

            const entityAMtd = monthRecords.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBMtd = monthRecords.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);

            const entityAPrior = priorMonthRecords.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBPrior = priorMonthRecords.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);

            const kpiHtml = `
                <div class="kpi-card">
                    <div class="kpi-label">A MTD</div>
                    <div class="kpi-value ${entityAMtd >= 0 ? 'profit' : 'loss'}">${formatCurrency(entityAMtd)}</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">B MTD</div>
                    <div class="kpi-value ${entityBMtd >= 0 ? 'profit' : 'loss'}">${formatCurrency(entityBMtd)}</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">A Prior</div>
                    <div class="kpi-value ${entityAPrior >= 0 ? 'profit' : 'loss'}">${formatCurrency(entityAPrior)}</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">B Prior</div>
                    <div class="kpi-value ${entityBPrior >= 0 ? 'profit' : 'loss'}">${formatCurrency(entityBPrior)}</div>
                </div>
            `;
            document.getElementById('kpiGrid').innerHTML = kpiHtml;
        }

        function renderSummaryBar(records) {
            const entityATotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBTotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);
            const combinedPnl = entityATotalPnl + entityBTotalPnl;

            const summaryHtml = `
                <div class="summary-card">
                    <div class="label">A 24D</div>
                    <div class="value" style="color: ${entityATotalPnl >= 0 ? '#10b981' : '#ef4444'}">${formatCurrency(entityATotalPnl)}</div>
                </div>
                <div class="summary-card">
                    <div class="label">B 24D</div>
                    <div class="value" style="color: ${entityBTotalPnl >= 0 ? '#10b981' : '#ef4444'}">${formatCurrency(entityBTotalPnl)}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Combined</div>
                    <div class="value" style="color: ${combinedPnl >= 0 ? '#10b981' : '#ef4444'}">${formatCurrency(combinedPnl)}</div>
                </div>
                <div class="summary-card">
                    <div class="label">Days</div>
                    <div class="value">${records.length}</div>
                </div>
            `;
            document.getElementById('summaryBar').innerHTML = summaryHtml;
        }

        function renderDayBoxes(records) {
            const daysHtml = [...records].reverse().map(record => {
                const date = record.date;
                const entityAPnl = record['pnl_Entity_A'] || 0;
                const entityBPnl = record['pnl_Entity_B'] || 0;

                return `
                    <div class="day-box">
                        <div class="day-date">${formatDate(date)}</div>
                        <div class="day-content">
                            <div class="entity-section">
                                <div class="entity-label">A</div>
                                <div class="entity-value ${entityAPnl >= 0 ? 'profit' : 'loss'}">${formatCurrency(entityAPnl)}</div>
                            </div>
                            <div class="entity-section">
                                <div class="entity-label">B</div>
                                <div class="entity-value ${entityBPnl >= 0 ? 'profit' : 'loss'}">${formatCurrency(entityBPnl)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('daysGrid').innerHTML = daysHtml;
        }
    </script>
</body>
</html>
