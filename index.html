<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily P&L Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 14px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* STATUS LINE */
        .status {
            margin-bottom: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* TOP KPI SECTION - CURRENT & PRIOR MONTH */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .kpi-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .kpi-section-title {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .kpi-card {
            padding: 16px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .kpi-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .kpi-value.profit {
            color: var(--success);
        }

        .kpi-value.loss {
            color: var(--danger);
        }

        .kpi-period {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* SUMMARY SECTION */
        .summary-section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            margin-top: 24px;
            font-weight: 600;
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .summary-card {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            background: var(--bg-secondary);
        }

        .summary-card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .summary-card .value {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            line-height: 1;
        }

        /* DAILY BREAKDOWN GRID */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 24px;
            flex: 1;
        }

        .day-box {
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            transition: all 0.2s ease;
            position: relative;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .day-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .day-date {
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .day-content {
            display: flex;
            flex-direction: row;
            gap: 4px;
            align-items: stretch;
            justify-content: space-between;
        }

        .entity-section {
            display: flex;
            flex-direction: column;
            padding: 4px;
            line-height: 1;
            flex: 1;
            text-align: center;
        }

        .entity-label {
            font-size: 10px;
            color: #666666;
            font-weight: 500;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .entity-value {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.2px;
            margin: 0px;
            padding: 0px;
        }

        .entity-value.profit {
            color: var(--success);
        }

        .entity-value.loss {
            color: var(--danger);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* UTILITIES */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        @media (max-width: 1400px) {
            .days-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1200px) {
            .days-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .summary-bar {
                grid-template-columns: repeat(4, 1fr);
            }

            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 992px) {
            .days-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px 12px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header .subtitle {
                font-size: 12px;
            }

            .kpi-grid {
                gap: 12px;
            }

            .kpi-cards {
                gap: 8px;
            }

            .kpi-value {
                font-size: 24px;
            }

            .days-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .summary-bar {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .day-box {
                padding: 8px;
            }

            .day-date {
                font-size: 14px;
                margin-bottom: 2px;
            }

            .entity-value {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px 10px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 2px;
            }

            .header .subtitle {
                font-size: 11px;
            }

            .status {
                font-size: 10px;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                margin-bottom: 24px;
            }

            .kpi-cards {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .kpi-card {
                padding: 12px;
            }

            .kpi-value {
                font-size: 20px;
            }

            .summary-section-title {
                font-size: 10px;
                margin-top: 16px;
                margin-bottom: 8px;
            }

            .summary-bar {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .summary-card {
                padding: 8px;
            }

            .summary-card .value {
                font-size: 18px;
            }

            .days-grid {
                grid-template-columns: 1fr;
                gap: 8px;
                margin-bottom: 16px;
            }

            .day-box {
                padding: 8px;
            }

            .day-date {
                font-size: 12px;
                margin-bottom: 2px;
            }

            .day-content {
                gap: 2px;
            }

            .entity-label {
                font-size: 9px;
                margin-bottom: 1px;
            }

            .entity-value {
                font-size: 16px;
            }

            .footer {
                font-size: 10px;
                padding-top: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Daily P&L Dashboard</h1>
            <p class="subtitle">Real-time portfolio performance tracking</p>
        </div>

        <div class="status" id="status">Loading portfolio data...</div>

        <!-- KPI GRID - CURRENT & PRIOR MONTH -->
        <div class="kpi-grid" id="kpiGrid">
            <div class="loading">Loading month data...</div>
        </div>

        <!-- SUMMARY METRICS -->
        <div class="summary-section-title">Performance Summary</div>
        <div class="summary-bar" id="summaryBar"></div>

        <!-- DAILY BREAKDOWN -->
        <div class="summary-section-title">Daily Breakdown (Entity A / B)</div>
        <div class="days-grid" id="daysGrid">
            <div class="loading">Generating daily performance...</div>
        </div>

        <div class="footer">
            <div>Last Updated: <span id="lastUpdated">—</span></div>
        </div>
    </div>

    <script>
        let globalData = null;

        window.addEventListener('load', () => {
            loadDataAuto();
        });

        async function loadDataAuto() {
            try {
                const response = await fetch('dashboard_data.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                globalData = await response.json();
                document.getElementById('status').textContent = 'Portfolio data loaded';
                renderDashboard();
            } catch (err) {
                document.getElementById('status').textContent = `Error loading data: ${err.message}`;
                console.error('Error:', err);
            }
        }

        function formatCurrency(val) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(val);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });
        }

        function getCurrentMonth(records) {
            if (!records || records.length === 0) return [];
            const lastRecord = records[records.length - 1];
            const lastDate = new Date(lastRecord.date);
            const dataMonth = lastDate.getMonth();
            const dataYear = lastDate.getFullYear();
            return records.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === dataMonth && recordDate.getFullYear() === dataYear;
            });
        }

        function getPriorMonth(records) {
            if (!records || records.length === 0) return [];
            const lastRecord = records[records.length - 1];
            const lastDate = new Date(lastRecord.date);

            let priorMonth = lastDate.getMonth() - 1;
            let priorYear = lastDate.getFullYear();
            if (priorMonth < 0) {
                priorMonth = 11;
                priorYear--;
            }

            return records.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === priorMonth && recordDate.getFullYear() === priorYear;
            });
        }

        function getLast31Days(records) {
            if (records.length <= 31) return records;
            return records.slice(-31);
        }

        function renderDashboard() {
            if (!globalData || globalData.records.length === 0) {
                document.getElementById('status').textContent = 'No data available';
                return;
            }

            const monthRecords = getCurrentMonth(globalData.records);
            const priorMonthRecords = getPriorMonth(globalData.records);
            const last31Records = getLast31Days(globalData.records);

            if (globalData.last_updated) {
                document.getElementById('lastUpdated').textContent = new Date(globalData.last_updated).toLocaleString();
            }

            renderKPIGrid(monthRecords, priorMonthRecords);
            renderSummaryBar(last31Records);
            renderDayBoxes(last31Records);

            document.getElementById('status').textContent = `Showing ${last31Records.length} trading days`;
        }

        function renderKPIGrid(monthRecords, priorMonthRecords) {
            const currentDate = new Date();
            const monthName = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const priorDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1);
            const priorMonthName = priorDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const entityAMtd = monthRecords.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBMtd = monthRecords.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);

            const entityAPrior = priorMonthRecords.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBPrior = priorMonthRecords.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);

            const kpiHtml = `
                <div class="kpi-section">
                    <div class="kpi-section-title">Current Month (${monthName})</div>
                    <div class="kpi-cards">
                        <div class="kpi-card">
                            <div class="kpi-label">Entity A</div>
                            <div class="kpi-value ${entityAMtd >= 0 ? 'profit' : 'loss'}">
                                ${formatCurrency(entityAMtd)}
                            </div>
                            <div class="kpi-period">Month-to-Date</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Entity B</div>
                            <div class="kpi-value ${entityBMtd >= 0 ? 'profit' : 'loss'}">
                                ${formatCurrency(entityBMtd)}
                            </div>
                            <div class="kpi-period">Month-to-Date</div>
                        </div>
                    </div>
                </div>

                <div class="kpi-section">
                    <div class="kpi-section-title">Prior Month (${priorMonthName})</div>
                    <div class="kpi-cards">
                        <div class="kpi-card">
                            <div class="kpi-label">Entity A</div>
                            <div class="kpi-value ${entityAPrior >= 0 ? 'profit' : 'loss'}">
                                ${formatCurrency(entityAPrior)}
                            </div>
                            <div class="kpi-period">Month Total</div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-label">Entity B</div>
                            <div class="kpi-value ${entityBPrior >= 0 ? 'profit' : 'loss'}">
                                ${formatCurrency(entityBPrior)}
                            </div>
                            <div class="kpi-period">Month Total</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('kpiGrid').innerHTML = kpiHtml;
        }

        function renderSummaryBar(records) {
            const entityATotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBTotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);
            const combinedPnl = entityATotalPnl + entityBTotalPnl;

            const summaryHtml = `
                <div class="summary-card">
                    <div class="label">Entity A 31-Day</div>
                    <div class="value ${entityATotalPnl >= 0 ? 'profit' : 'loss'}" style="color: ${entityATotalPnl >= 0 ? '#10b981' : '#ef4444'}">
                        ${formatCurrency(entityATotalPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Entity B 31-Day</div>
                    <div class="value ${entityBTotalPnl >= 0 ? 'profit' : 'loss'}" style="color: ${entityBTotalPnl >= 0 ? '#10b981' : '#ef4444'}">
                        ${formatCurrency(entityBTotalPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Combined 31-Day</div>
                    <div class="value ${combinedPnl >= 0 ? 'profit' : 'loss'}" style="color: ${combinedPnl >= 0 ? '#10b981' : '#ef4444'}">
                        ${formatCurrency(combinedPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Trading Days</div>
                    <div class="value">${records.length}</div>
                </div>
            `;
            document.getElementById('summaryBar').innerHTML = summaryHtml;
        }

        function renderDayBoxes(records) {
            const daysHtml = records.map(record => {
                const date = record.date;
                const entityAPnl = record['pnl_Entity_A'] || 0;
                const entityBPnl = record['pnl_Entity_B'] || 0;

                return `
                    <div class="day-box">
                        <div class="day-date">${formatDate(date)}</div>
                        <div class="day-content">
                            <div class="entity-section">
                                <div class="entity-label">Entity A</div>
                                <div class="entity-value ${entityAPnl >= 0 ? 'profit' : 'loss'}">
                                    ${formatCurrency(entityAPnl)}
                                </div>
                            </div>
                            <div class="entity-section">
                                <div class="entity-label">Entity B</div>
                                <div class="entity-value ${entityBPnl >= 0 ? 'profit' : 'loss'}">
                                    ${formatCurrency(entityBPnl)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('daysGrid').innerHTML = daysHtml;
        }
    </script>
</body>
</html>
