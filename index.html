<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIE & Pinkcity Daily P&L - 31 Day View</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #1f77b4;
            --secondary: #ff7f0e;
            --success: #2ca02c;
            --danger: #d62728;
            --bg-light: #f8f9fa;
            --bg-dark: #2b2b2b;
            --text-dark: #1a1a1a;
            --text-light: #e0e0e0;
            --border: #e0e0e0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #6ba3d9;
                --secondary: #ffb366;
                --success: #5dd95d;
                --danger: #ff6b6b;
                --bg-light: #1a1a1a;
                --text-dark: #e0e0e0;
                --border: #333;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 12px;
        }

        .header {
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 0.95em;
            color: var(--text-dark);
            opacity: 0.8;
        }

        .mtd-banner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(31, 119, 180, 0.08), rgba(255, 127, 14, 0.08));
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .mtd-card {
            text-align: center;
            padding: 8px;
        }

        .mtd-label {
            font-size: 0.65em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .mtd-value {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .mtd-period {
            font-size: 0.6em;
            opacity: 0.6;
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }

        .summary-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            .summary-card {
                background: #2b2b2b;
            }
        }

        .summary-card .label {
            font-size: 0.65em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .summary-card .value {
            font-size: 1.1em;
            font-weight: bold;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }

        .day-box {
            background: white;
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .day-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            .day-box {
                background: #2b2b2b;
            }
            .day-box:hover {
                box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            }
        }

        .day-date {
            font-size: 0.7em;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .day-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .entity-pnl {
            padding: 4px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75em;
        }

        .entity-label {
            font-size: 0.6em;
            opacity: 0.7;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .entity-value {
            font-size: 0.85em;
            font-weight: bold;
        }

        .pie-gain {
            background: rgba(44, 160, 44, 0.15);
            color: var(--success);
            border: 1px solid rgba(44, 160, 44, 0.3);
        }

        .pie-loss {
            background: rgba(214, 39, 40, 0.15);
            color: var(--danger);
            border: 1px solid rgba(214, 39, 40, 0.3);
        }

        .pinkcity-gain {
            background: rgba(44, 160, 44, 0.15);
            color: var(--success);
            border: 1px solid rgba(44, 160, 44, 0.3);
        }

        .pinkcity-loss {
            background: rgba(214, 39, 40, 0.15);
            color: var(--danger);
            border: 1px solid rgba(214, 39, 40, 0.3);
        }

        .day-box.weekend {
            opacity: 0.6;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            opacity: 0.7;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
            opacity: 0.7;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .summary-section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Daily P&L Dashboard</h1>
            <p class="subtitle">Month-to-Date & 31-Day Rolling Performance</p>
        </div>

        <div class="status" id="status">Loading data...</div>

        <!-- MONTH-TO-DATE TOTALS -->
        <div class="mtd-banner" id="mtdBanner">
            <div class="loading">Loading MTD data...</div>
        </div>

        <div class="summary-section-title">31-Day Rolling Summary</div>
        <div class="summary-bar" id="summaryBar"></div>

        <div class="summary-section-title">Daily Breakdown</div>
        <div class="days-grid" id="daysGrid">
            <div class="loading">Generating daily boxes...</div>
        </div>

        <div class="footer">
            Last Updated: <span id="lastUpdated">—</span>
        </div>
    </div>

    <script>
        let globalData = null;

        // Auto-load data on page load
        window.addEventListener('load', () => {
            loadDataAuto();
        });

        async function loadDataAuto() {
            try {
                const response = await fetch('dashboard_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                globalData = await response.json();
                document.getElementById('status').textContent = 'Data loaded successfully';
                renderDashboard();
            } catch (err) {
                document.getElementById('status').textContent = `Error: ${err.message}`;
                console.error('Error:', err);
            }
        }

        function formatCurrency(val) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(val);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                weekday: 'short'
            });
        }

        function isWeekend(dateStr) {
            const d = new Date(dateStr);
            const day = d.getDay();
            return day === 0 || day === 6;
        }

        function getLast31Days(records) {
            if (records.length <= 31) return records;
            return records.slice(-31);
        }

        function getCurrentMonth(records) {
            if (!records || records.length === 0) return [];

            // Get the month/year from the most recent record in the data
            const lastRecord = records[records.length - 1];
            const lastDate = new Date(lastRecord.date);
            const dataMonth = lastDate.getMonth();
            const dataYear = lastDate.getFullYear();

            return records.filter(record => {
                const recordDate = new Date(record.date);
                return recordDate.getMonth() === dataMonth && recordDate.getFullYear() === dataYear;
            });
        }

        function renderDashboard() {
            if (!globalData || globalData.records.length === 0) {
                document.getElementById('status').textContent = 'No data available';
                return;
            }

            // Get current month data
            const monthRecords = getCurrentMonth(globalData.records);

            // Get last 31 days
            const last31Records = getLast31Days(globalData.records);

            // Update timestamp
            if (globalData.last_updated) {
                document.getElementById('lastUpdated').textContent = new Date(globalData.last_updated).toLocaleString();
            }

            // Render MTD banner
            renderMTDBanner(monthRecords);

            // Render 31-day summary bar
            renderSummaryBar(last31Records);

            // Render day boxes
            renderDayBoxes(last31Records);

            document.getElementById('status').textContent = `Showing last ${last31Records.length} trading days (${monthRecords.length} in current month)`;
        }

        function renderMTDBanner(records) {
            const entityAMtd = records.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBMtd = records.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);

            const currentDate = new Date();
            const monthName = currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const mtdHtml = `
                <div class="mtd-card">
                    <div class="mtd-label">Entity A</div>
                    <div class="mtd-value" style="color: ${entityAMtd >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityAMtd)}
                    </div>
                    <div class="mtd-period">Month-to-Date (${monthName})</div>
                </div>
                <div class="mtd-card">
                    <div class="mtd-label">Entity B</div>
                    <div class="mtd-value" style="color: ${entityBMtd >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityBMtd)}
                    </div>
                    <div class="mtd-period">Month-to-Date (${monthName})</div>
                </div>
            `;
            document.getElementById('mtdBanner').innerHTML = mtdHtml;
        }

        function renderSummaryBar(records) {
            const entityATotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_A'] || 0), 0);
            const entityBTotalPnl = records.reduce((sum, r) => sum + (r['pnl_Entity_B'] || 0), 0);
            const combinedPnl = entityATotalPnl + entityBTotalPnl;

            const summaryHtml = `
                <div class="summary-card">
                    <div class="label">Entity A 31-Day</div>
                    <div class="value" style="color: ${entityATotalPnl >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityATotalPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Entity B 31-Day</div>
                    <div class="value" style="color: ${entityBTotalPnl >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(entityBTotalPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Combined 31-Day</div>
                    <div class="value" style="color: ${combinedPnl >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${formatCurrency(combinedPnl)}
                    </div>
                </div>
                <div class="summary-card">
                    <div class="label">Trading Days</div>
                    <div class="value">${records.length}</div>
                </div>
            `;
            document.getElementById('summaryBar').innerHTML = summaryHtml;
        }

        function renderDayBoxes(records) {
            const daysHtml = records.map(record => {
                const date = record.date;
                const entityAPnl = record['pnl_Entity_A'] || 0;
                const entityBPnl = record['pnl_Entity_B'] || 0;
                const isWeekendDay = isWeekend(date);

                return `
                    <div class="day-box ${isWeekendDay ? 'weekend' : ''}">
                        <div class="day-date">${formatDate(date)}</div>
                        <div class="day-content">
                            <div class="entity-pnl ${entityAPnl >= 0 ? 'pie-gain' : 'pie-loss'}">
                                <div class="entity-label">Entity A</div>
                                <div class="entity-value">${formatCurrency(entityAPnl)}</div>
                            </div>
                            <div class="entity-pnl ${entityBPnl >= 0 ? 'pinkcity-gain' : 'pinkcity-loss'}">
                                <div class="entity-label">Entity B</div>
                                <div class="entity-value">${formatCurrency(entityBPnl)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('daysGrid').innerHTML = daysHtml;
        }
    </script>
</body>
</html>
